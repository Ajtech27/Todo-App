<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Todo App</title>

    <!-- Bootstrap 5 (CDN) -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
    <!-- Font Awesome (for icons) -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
        /* ── Custom Styles ── */
        body {
            background: linear-gradient(145deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .todo-container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            padding: 2.5rem 2rem;
            max-width: 700px;
            width: 100%;
            margin: 1.5rem;
        }

        h1 {
            font-weight: 700;
            color: #2c3e50;
            font-size: 2.2rem;
        }

        .input-group {
            margin-bottom: 1.8rem;
        }

        .input-group input {
            border-radius: 30px 0 0 30px;
            border: 2px solid #dee2e6;
            padding: 0.75rem 1.2rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #6c63ff;
            box-shadow: none;
        }

        .input-group button {
            border-radius: 0 30px 30px 0;
            background: #6c63ff;
            color: white;
            border: none;
            padding: 0 1.8rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .input-group button:hover {
            background: #5a52d5;
        }

        /* ── Todo List ── */
        .todo-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.15s;
            border-left: 5px solid #6c63ff;
        }

        .todo-item:hover {
            background: #f1f2f6;
        }

        .todo-text {
            flex: 1;
            font-size: 1.05rem;
            color: #2c3e50;
            word-break: break-word;
            margin-right: 1rem;
        }

        .todo-text.editing {
            display: none;
        }

        .todo-edit-input {
            flex: 1;
            display: none;
            border: 2px solid #6c63ff;
            border-radius: 20px;
            padding: 0.4rem 1rem;
            font-size: 1rem;
            margin-right: 0.8rem;
            outline: none;
        }

        .todo-edit-input.active {
            display: block;
        }

        .todo-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .todo-actions button {
            border: none;
            background: transparent;
            font-size: 1.1rem;
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
            transition: background 0.15s;
            color: #6c757d;
        }

        .todo-actions button:hover {
            background: #e9ecef;
        }

        .todo-actions .btn-edit:hover {
            color: #6c63ff;
        }

        .todo-actions .btn-delete:hover {
            color: #dc3545;
        }

        .todo-actions .btn-save {
            color: #28a745;
            font-weight: 600;
        }

        .todo-actions .btn-save:hover {
            background: #d4edda;
        }

        .todo-actions .btn-cancel {
            color: #6c757d;
        }

        .todo-actions .btn-cancel:hover {
            background: #e2e6ea;
        }

        .empty-message {
            text-align: center;
            color: #adb5bd;
            font-size: 1.1rem;
            padding: 2rem 0;
        }

        .counter {
            margin-top: 1.2rem;
            font-size: 0.95rem;
            color: #6c757d;
            text-align: center;
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .todo-container {
                padding: 1.5rem 1rem;
            }
            .todo-item {
                flex-wrap: wrap;
            }
            .todo-actions {
                margin-top: 0.4rem;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h1 class="text-center mb-4">📝 My Todo List</h1>

        <!-- Add Todo Form -->
        <div class="input-group">
            <input
                type="text"
                id="todoInput"
                class="form-control"
                placeholder="What do you need to do?"
                autofocus
            />
            <button id="addBtn" class="btn">Add</button>
        </div>

        <!-- Todo List -->
        <div id="todoList"></div>

        <!-- Counter -->
        <div id="counter" class="counter"></div>
    </div>

    <!-- ─── JavaScript ─── -->
    <script>
        // ── Constants ──
        const STORAGE_KEY = 'todos';

        // ── DOM References ──
        const todoListEl = document.getElementById('todoList');
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const counterEl = document.getElementById('counter');

        // ── State ──
        let todos = [];
        let editingId = null; // ID of the todo currently being edited

        // ── Load from localStorage ──
        function loadTodos() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    todos = JSON.parse(stored);
                } catch (e) {
                    todos = [];
                }
            } else {
                todos = [];
            }
            render();
        }

        // ── Save to localStorage ──
        function saveTodos() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
        }

        // ── Render the todo list ──
        function render() {
            if (todos.length === 0) {
                todoListEl.innerHTML = `<div class="empty-message">✨ No todos yet. Add one above!</div>`;
                counterEl.textContent = '0 items';
                return;
            }

            let html = '';
            todos.forEach(todo => {
                const isEditing = (editingId === todo.id);
                html += `
                    <div class="todo-item" data-id="${todo.id}">
                        <span class="todo-text ${isEditing ? 'editing' : ''}">${escapeHtml(todo.text)}</span>
                        <input type="text" class="todo-edit-input ${isEditing ? 'active' : ''}" value="${escapeHtml(todo.text)}" data-id="${todo.id}" />
                        <div class="todo-actions">
                            ${isEditing ? `
                                <button class="btn-save" data-id="${todo.id}"><i class="fas fa-check"></i> Save</button>
                                <button class="btn-cancel" data-id="${todo.id}"><i class="fas fa-times"></i></button>
                            ` : `
                                <button class="btn-edit" data-id="${todo.id}"><i class="fas fa-pen"></i></button>
                                <button class="btn-delete" data-id="${todo.id}"><i class="fas fa-trash"></i></button>
                            `}
                        </div>
                    </div>
                `;
            });

            todoListEl.innerHTML = html;
            counterEl.textContent = `${todos.length} item${todos.length !== 1 ? 's' : ''}`;

            // ── Attach event listeners ──
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    deleteTodo(id);
                });
            });

            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    startEditing(id);
                });
            });

            document.querySelectorAll('.btn-save').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    const input = document.querySelector(`.todo-edit-input[data-id="${id}"]`);
                    if (input) {
                        const newText = input.value.trim();
                        if (newText) {
                            saveEdit(id, newText);
                        } else {
                            alert('Todo text cannot be empty.');
                        }
                    }
                });
            });

            document.querySelectorAll('.btn-cancel').forEach(btn => {
                btn.addEventListener('click', () => {
                    cancelEditing();
                });
            });

            // Enter key on edit inputs
            document.querySelectorAll('.todo-edit-input').forEach(input => {
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        const id = parseInt(input.dataset.id);
                        const newText = input.value.trim();
                        if (newText) {
                            saveEdit(id, newText);
                        } else {
                            alert('Todo text cannot be empty.');
                        }
                    } else if (e.key === 'Escape') {
                        cancelEditing();
                    }
                });
            });
        }

        // ── CRUD Operations ──

        // Add
        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) {
                alert('Please enter a task.');
                return;
            }

            const newTodo = {
                id: Date.now(),
                text: text,
            };

            todos.push(newTodo);
            saveTodos();
            todoInput.value = '';
            todoInput.focus();
            render();
        }

        // Delete
        function deleteTodo(id) {
            if (!confirm('Delete this todo?')) return;
            todos = todos.filter(t => t.id !== id);
            if (editingId === id) editingId = null;
            saveTodos();
            render();
        }

        // Start editing
        function startEditing(id) {
            editingId = id;
            render();
            // Auto-focus the edit input
            const input = document.querySelector(`.todo-edit-input[data-id="${id}"]`);
            if (input) {
                input.focus();
                input.select();
            }
        }

        // Save edit
        function saveEdit(id, newText) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.text = newText;
                saveTodos();
            }
            editingId = null;
            render();
        }

        // Cancel editing
        function cancelEditing() {
            editingId = null;
            render();
        }

        // ── Helper: Escape HTML (prevent XSS) ──
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ── Event Listeners ──
        addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTodo();
            }
        });

        // ── Initial Load ──
        loadTodos();
    </script>

    <!-- Bootstrap JS (optional, for toggle behaviors if needed) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
